# Load backend environment variables from project-root .env
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL / Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.socketTimeout=120
spring.datasource.hikari.data-source-properties.connectTimeout=30
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=15
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=2
spring.flyway.lock-retry-count=50

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Supabase JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}

# Supabase application configuration
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:${VITE_SUPABASE_PUBLISHABLE_KEY:}}

# Server
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:4}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:100}

# GitHub
github.token=${GITHUB_TOKEN:}

# Repository Indexing & Resource Constraints (Render Free Tier 512MB RAM Safeguards)
plexus.indexing.max-source-files=${INDEXING_MAX_SOURCE_FILES:150}
plexus.indexing.max-archive-size-bytes=${INDEXING_MAX_ARCHIVE_SIZE_BYTES:15728640}
plexus.indexing.max-file-size-bytes=${INDEXING_MAX_FILE_SIZE_BYTES:1048576}
plexus.indexing.max-extracted-size-bytes=${INDEXING_MAX_EXTRACTED_SIZE_BYTES:10485760}
plexus.indexing.max-concurrent-analysis=${INDEXING_MAX_CONCURRENT_ANALYSIS:1}

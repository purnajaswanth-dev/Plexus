version: '3.8'

services:
  plexus-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL}}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY}}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: plexus-impact-mapper
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SUPABASE_JWT_ISSUER_URI=${SUPABASE_JWT_ISSUER_URI}
      - SUPABASE_JWKS_URI=${SUPABASE_JWKS_URI}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

